name: "🔨 Build SukiSU-Ultra Kernel (lisa) v16"

on:
  workflow_dispatch:
    inputs:
      sukisu_branch:
        description: "🌿 SukiSU-Ultra branch"
        required: true
        default: "main"
        type: choice
        options: [main, susfs-main, susfs-test]
      apply_optional_patches:
        description: "🔧 Apply optional patches (input.c)"
        required: true
        default: "false"
        type: choice
        options: ["true", "false"]
      clang_version:
        description: "⚙️ Clang toolchain"
        required: true
        default: "proton"
        type: choice
        options: [proton, zyc]

env:
  KERNEL_REPO: https://github.com/PixelExperience-Devices/kernel_xiaomi_lisa
  KERNEL_BRANCH: thirteen
  DEVICE: lisa
  ARCH: arm64
  WORK_DIR: ${{ github.workspace }}

jobs:
  build:
    name: "🔨 Build kernel for lisa"
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: "📥 Step 1: Checkout"
        uses: actions/checkout@v4

      - name: "📦 Step 2: Install dependencies"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            git curl wget zip unzip python3 python-is-python3 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            ca-certificates lz4 xz-utils cpio file \
            lld llvm
          echo "✅ Dependencies installed"

      - name: "🐧 Step 3: Clone kernel source"
        run: |
          git clone --depth=1 --branch=$KERNEL_BRANCH $KERNEL_REPO $WORK_DIR/kernel_source
          echo "✅ Cloned $(cd $WORK_DIR/kernel_source && git log --oneline -1)"

      - name: "🔧 Step 4: Setup SukiSU-Ultra (builtin)"
        run: |
          cd $WORK_DIR/kernel_source
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${{ inputs.sukisu_branch }}/kernel/setup.sh" | bash -s builtin
          [ -d drivers/kernelsu ] && echo "✅ SukiSU-Ultra integrated" || { echo "❌ Failed"; exit 1; }

      - name: "📄 Step 5: SUSFS stub headers"
        run: |
          cd $WORK_DIR/kernel_source
          for h in susfs.h susfs_def.h susfs_redirect.h; do
            [ -f "include/linux/$h" ] && continue
            G="_LINUX_$(echo $h | tr 'a-z.' 'A-Z_')"
            printf '#ifndef %s\n#define %s\n#include <linux/types.h>\n#endif\n' "$G" "$G" > "include/linux/$h"
            echo "  ✅ Stub: include/linux/$h"
          done

      - name: "🔩 Step 6: Apply manual hooks"
        run: |
          cd $WORK_DIR/kernel_source
          chmod +x $WORK_DIR/scripts/apply-hooks.sh
          if [ "${{ inputs.apply_optional_patches }}" = "true" ]; then
            bash $WORK_DIR/scripts/apply-hooks.sh --optional
          else
            bash $WORK_DIR/scripts/apply-hooks.sh
          fi

      - name: "🩹 Step 7: Source compatibility patches"
        run: |
          cd $WORK_DIR/kernel_source

          # Fix 1: typecheck.h
          [ -f include/linux/typecheck.h ] && \
            sed -i 's/typeof(x) __dummy2;/typeof(x) __dummy2 = (typeof(x))0;/' include/linux/typecheck.h && \
            echo "  ✅ Fix 1: typecheck.h" || true

          # Fix 2: sde_hw_dsc_1_2.c
          F="techpack/display/msm/sde/sde_hw_dsc_1_2.c"
          [ -f "$F" ] && sed -i 's/static inline _dsc_subblk_offset/static inline int _dsc_subblk_offset/' "$F" && \
            echo "  ✅ Fix 2: sde_hw_dsc_1_2.c" || true

          # Fix 3: sulog/event.c
          F=$(find drivers/ -path "*/sulog/event.c" -type f 2>/dev/null | head -1)
          [ -n "$F" ] && sed -i 's/#define USER_ARG_NULL user_arg_null_ptr()/#define USER_ARG_NULL (*user_arg_null_ptr())/' "$F" && \
            echo "  ✅ Fix 3: sulog/event.c" || true

          # Fix 4: SELinux hiding stubs
          KSU_DIR=$(find drivers/ -type d -name "kernelsu" | head -1)
          if [ -n "$KSU_DIR" ] && [ ! -f "$KSU_DIR/selinux_hide_stub.c" ]; then
            printf '#include <linux/types.h>\nvoid ksu_selinux_hide_handle_second_stage(void) {}\nvoid ksu_selinux_hide_handle_post_fs_data(void) {}\n' > "$KSU_DIR/selinux_hide_stub.c"
            for bf in "$KSU_DIR/Makefile" "$KSU_DIR/Kbuild"; do
              [ -f "$bf" ] && ! grep -q selinux_hide_stub "$bf" && echo "obj-y += selinux_hide_stub.o" >> "$bf" && break
            done
            echo "  ✅ Fix 4: selinux_hide_stub.c"
          fi

      # ═══════════════════════════════════════════════════════
      # Step 8: Defconfig
      # v16: Force touchscreen as BUILT-IN (=y not =m)
      #      so touch works WITHOUT modules
      # ═══════════════════════════════════════════════════════
      - name: "⚙️ Step 8: Modify defconfig (touch built-in)"
        run: |
          cd $WORK_DIR/kernel_source

          # Find defconfig
          DC=""
          for d in \
            "arch/$ARCH/configs/vendor/lahaina-qgki_defconfig" \
            "arch/$ARCH/configs/lisa_defconfig" \
            "arch/$ARCH/configs/vendor/lisa_defconfig"; do
            [ -f "$d" ] && DC="$d" && break
          done
          [ -z "$DC" ] && DC=$(find arch/$ARCH/configs -name "*lisa*" -o -name "*lahaina-qgki*" 2>/dev/null | head -1)
          [ -z "$DC" ] && { echo "❌ No defconfig!"; exit 1; }
          echo "📋 Using: $DC"

          # ── KSU configs ──
          sed -i '/CONFIG_KSU/d; /CONFIG_KPROBES/d; /CONFIG_KALLSYMS/d' "$DC"
          cat >> "$DC" << 'KSU_CFG'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KPROBES is not set
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          # CONFIG_KSU_SUSFS is not set
          KSU_CFG
          sed -i 's/^          //' "$DC"

          # ══════════════════════════════════════════════════
          # v16 FIX: Force touchscreen drivers BUILT-IN (=y)
          # This way touch works even with do.modules=0
          # ══════════════════════════════════════════════════
          echo ""
          echo "🖐️ Forcing touchscreen drivers as built-in..."
          for pat in \
            CONFIG_TOUCHSCREEN_GOODIX_BRL \
            CONFIG_TOUCHSCREEN_GOODIX_GTX8 \
            CONFIG_TOUCHSCREEN_GOODIX \
            CONFIG_TOUCHSCREEN_FTS \
            CONFIG_TOUCHSCREEN_FOCALTECH \
            CONFIG_TOUCHSCREEN_NT36XXX \
            CONFIG_TOUCHSCREEN_NOVATEK \
            CONFIG_TOUCHSCREEN_SYNAPTICS \
            CONFIG_TOUCHSCREEN_ATMEL \
            CONFIG_INPUT_TOUCHSCREEN; do
            if grep -q "${pat}=m" "$DC"; then
              sed -i "s/${pat}=m/${pat}=y/" "$DC"
              echo "  ✅ $pat: m → y"
            elif grep -q "${pat}=y" "$DC"; then
              echo "  ✅ $pat: already =y"
            fi
          done
          # Catch-all: any remaining touchscreen modules → built-in
          sed -i '/CONFIG_TOUCHSCREEN.*=m/s/=m/=y/' "$DC"
          echo ""

          # ── Generate .config ──
          DC_NAME=$(basename "$DC")
          make O=out ARCH=$ARCH $DC_NAME 2>&1 | tee $WORK_DIR/build_defconfig.log

          # ── Disable SUSFS ──
          echo ""
          echo "🚫 Disabling SUSFS in .config..."
          sed -i '/CONFIG_KSU_SUSFS/d' out/.config
          cat >> out/.config << 'SUSFS_OFF'
          # CONFIG_KSU_SUSFS is not set
          # CONFIG_KSU_SUSFS_SUS_PATH is not set
          # CONFIG_KSU_SUSFS_SUS_MOUNT is not set
          # CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT is not set
          # CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT is not set
          # CONFIG_KSU_SUSFS_SUS_KSTAT is not set
          # CONFIG_KSU_SUSFS_SUS_OVERLAYFS is not set
          # CONFIG_KSU_SUSFS_TRY_UMOUNT is not set
          # CONFIG_KSU_SUSFS_SPOOF_UNAME is not set
          # CONFIG_KSU_SUSFS_ENABLE_LOG is not set
          # CONFIG_KSU_SUSFS_OPEN_REDIRECT is not set
          # CONFIG_KSU_SUSFS_SUS_SU is not set
          SUSFS_OFF
          sed -i 's/^          //' out/.config

          # ── Force touchscreen built-in in .config too ──
          echo "🖐️ Force touchscreen =y in .config..."
          sed -i '/CONFIG_TOUCHSCREEN/s/=m/=y/' out/.config
          sed -i 's/CONFIG_INPUT_TOUCHSCREEN=m/CONFIG_INPUT_TOUCHSCREEN=y/' out/.config

          # ── olddefconfig: resolve deps non-interactively ──
          echo ""
          echo "🔄 Running olddefconfig..."
          make O=out ARCH=$ARCH olddefconfig 2>&1

          # ── Verify touchscreen ──
          echo ""
          echo "📋 Touchscreen configs in .config:"
          grep -i "CONFIG_TOUCHSCREEN" out/.config | head -20
          echo ""
          echo "📋 KSU configs:"
          grep "CONFIG_KSU" out/.config || true
          echo ""
          echo "✅ Defconfig ready"

      # ═══════════════════════════════════════════════════════
      # Step 9: Setup toolchain — save FULL PATH for LD
      # ═══════════════════════════════════════════════════════
      - name: "🔧 Step 9: Setup toolchain"
        run: |
          if [ "${{ inputs.clang_version }}" = "proton" ]; then
            git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $WORK_DIR/toolchain
            CLANG_BIN="$WORK_DIR/toolchain/bin"
          else
            mkdir -p $WORK_DIR/toolchain
            URL=$(curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases/latest | grep "browser_download_url.*tar.gz" | head -1 | cut -d'"' -f4)
            if [ -n "$URL" ]; then
              wget -q "$URL" -O clang.tar.gz && tar xzf clang.tar.gz -C $WORK_DIR/toolchain && rm clang.tar.gz
            else
              git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $WORK_DIR/toolchain
            fi
            CLANG_BIN=$(dirname "$(find $WORK_DIR/toolchain -name clang -type f -executable | head -1)")
          fi

          # Save env vars + add to GITHUB_PATH
          echo "CLANG_BIN=$CLANG_BIN" >> $GITHUB_ENV
          echo "$CLANG_BIN" >> $GITHUB_PATH

          # Save FULL PATH for each tool (belt-and-suspenders)
          echo "LD_FULL=$CLANG_BIN/ld.lld" >> $GITHUB_ENV
          echo "AR_FULL=$CLANG_BIN/llvm-ar" >> $GITHUB_ENV
          echo "NM_FULL=$CLANG_BIN/llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY_FULL=$CLANG_BIN/llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP_FULL=$CLANG_BIN/llvm-objdump" >> $GITHUB_ENV
          echo "STRIP_FULL=$CLANG_BIN/llvm-strip" >> $GITHUB_ENV

          # Symlinks as extra fallback
          sudo ln -sf "$CLANG_BIN/ld.lld" /usr/local/bin/ld.lld 2>/dev/null || true

          echo ""
          echo "✅ Toolchain: $CLANG_BIN"
          "$CLANG_BIN/clang" --version | head -1
          echo "✅ ld.lld: $CLANG_BIN/ld.lld"

      # ═══════════════════════════════════════════════════════
      # Step 10: Build — uses FULL PATHS for all tools
      # ═══════════════════════════════════════════════════════
      - name: "🔨 Step 10: Build kernel"
        run: |
          cd $WORK_DIR/kernel_source

          # Verify tools
          echo "🔍 Verifying toolchain..."
          [ -x "${{ env.LD_FULL }}" ] && echo "  ✅ LD: ${{ env.LD_FULL }}" || { echo "  ❌ LD not found!"; exit 1; }
          [ -x "${{ env.CLANG_BIN }}/clang" ] && echo "  ✅ CC: ${{ env.CLANG_BIN }}/clang" || { echo "  ❌ clang!"; exit 1; }
          echo ""

          KC="-Wno-default-const-init-var-unsafe -Wno-default-const-init-field-unsafe"
          KC="$KC -Wno-sometimes-uninitialized -Wno-uninitialized -Wno-enum-conversion"
          KC="$KC -Wno-enum-compare -Wno-implicit-function-declaration -Wno-implicit-int"
          KC="$KC -Wno-int-conversion -Wno-unused-function -Wno-gnu-offsetof-extensions"
          KC="$KC -Wno-single-bit-bitfield-constant-conversion -Wno-array-parameter"

          echo "🔨 Building kernel..."
          make O=out ARCH=$ARCH \
            CC=${{ env.CLANG_BIN }}/clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=${{ env.LD_FULL }} \
            AR=${{ env.AR_FULL }} \
            NM=${{ env.NM_FULL }} \
            OBJCOPY=${{ env.OBJCOPY_FULL }} \
            OBJDUMP=${{ env.OBJDUMP_FULL }} \
            STRIP=${{ env.STRIP_FULL }} \
            KCFLAGS="$KC" \
            -j$(nproc) 2>&1 | tee $WORK_DIR/build_kernel.log

          IMG=$(find out/arch/$ARCH/boot -name "Image*" -type f | head -1)
          [ -z "$IMG" ] && { echo "❌ BUILD FAILED"; tail -80 $WORK_DIR/build_kernel.log; exit 1; }
          echo ""
          echo "════════════════════════════════════"
          echo "✅ BUILD SUCCESS: $IMG ($(stat -c%s "$IMG" | numfmt --to=iec))"
          echo "════════════════════════════════════"

      # ═══════════════════════════════════════════════════════
      # Step 11: AnyKernel3 — NO modules, touch is built-in
      # ═══════════════════════════════════════════════════════
      - name: "📦 Step 11: Package AnyKernel3 (no modules)"
        run: |
          cd $WORK_DIR
          TIMESTAMP=$(date +%Y%m%d-%H%M)

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cd anykernel
          rm -rf modules patch ramdisk LICENSE README.md

          cat > anykernel.sh << 'AKEOF'
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers
          
          properties() { '
          kernel.string=SukiSU-Ultra-ManualHook for Xiaomi 11 Lite NE 5G (lisa)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=lisa
          device.name2=lisain
          device.name3=lisanin
          supported.versions=
          supported.patchlevels=
          '; }
          
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          
          . tools/ak3-core.sh;
          
          split_boot;
          flash_boot;
          flash_dtbo;
          AKEOF

          # Verify
          grep -q "block=" anykernel.sh && echo "✅ block=" || exit 1
          grep -q "do.modules=0" anykernel.sh && echo "✅ do.modules=0 (touch is built-in)" || exit 1
          grep -q "split_boot" anykernel.sh && echo "✅ split_boot" || exit 1

          # Copy kernel Image
          for img in Image Image.gz; do
            [ -f "$WORK_DIR/kernel_source/out/arch/$ARCH/boot/$img" ] && \
              cp "$WORK_DIR/kernel_source/out/arch/$ARCH/boot/$img" . && \
              echo "✅ $img" && break
          done

          # DTBO
          [ -f "$WORK_DIR/kernel_source/out/arch/$ARCH/boot/dtbo.img" ] && \
            cp "$WORK_DIR/kernel_source/out/arch/$ARCH/boot/dtbo.img" . && echo "✅ dtbo.img"

          # NO modules needed — touchscreen is built-in!
          echo ""
          echo "ℹ️ No modules included (do.modules=0)"
          echo "   Touchscreen driver compiled as built-in (=y)"

          ZIP_NAME="SukiSU-Ultra-ManualHook-lisa-${TIMESTAMP}.zip"
          zip -r9 "$WORK_DIR/$ZIP_NAME" . -x ".git*"
          echo ""
          echo "✅ $ZIP_NAME ($(stat -c%s "$WORK_DIR/$ZIP_NAME" | numfmt --to=iec))"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: "📤 Step 12: Upload ZIP"
        uses: actions/upload-artifact@v4
        with:
          name: "SukiSU-Ultra-ManualHook-${{ env.DEVICE }}"
          path: ${{ env.WORK_DIR }}/${{ env.ZIP_NAME }}
          retention-days: 30

      - name: "📤 Step 12b: Upload Image"
        uses: actions/upload-artifact@v4
        with:
          name: "kernel-${{ env.DEVICE }}"
          path: |
            ${{ env.WORK_DIR }}/kernel_source/out/arch/${{ env.ARCH }}/boot/Image
            ${{ env.WORK_DIR }}/kernel_source/out/arch/${{ env.ARCH }}/boot/Image.gz
          retention-days: 30
          if-no-files-found: warn

      - name: "📤 Step 12c: Upload logs"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "build-logs"
          path: |
            ${{ env.WORK_DIR }}/build_defconfig.log
            ${{ env.WORK_DIR }}/build_kernel.log
          retention-days: 7
